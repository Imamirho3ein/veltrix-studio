    <path d="M760 560c30-90 62-160 118-206 34-28 74-42 118-44 44-2 84 12 124 30v220H760z" fill="#ffffff" opacity="0.12"/>
    <path d="M742 600c46-66 82-96 132-126 46-28 96-34 146-22 38 9 70 26 100 46v142H742z" fill="#111111" opacity="0.12"/>
